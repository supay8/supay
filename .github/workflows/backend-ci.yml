name: Backend architecture and tests
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: supay-ci
          POSTGRES_DB: supay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:supay-ci@localhost:5432/supay_ci?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Unit and contract tests (including race detection)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check generated SDK calls
        run: |
          go generate ./internal/adapters/siat
          git diff --exit-code -- internal/adapters/siat/builder_calls_generated.go internal/domain/fiscal/sector_json_types_generated.go
      - name: Install architecture linter
        # This linter requires Go 1.26; application tests use go.mod's version.
        run: GOTOOLCHAIN=go1.26.5 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Enforce dependency direction
        run: golangci-lint run
