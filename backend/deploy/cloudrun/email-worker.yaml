apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: supay-email-worker
  namespace: "${PROJECT_NUMBER}"
  labels:
    cloud.googleapis.com/location: "${REGION}"
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 20
      timeoutSeconds: 600
      serviceAccountName: supay-email-worker@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - name: email-worker
          image: "${IMAGE}"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: DEPLOYMENT_MODE
              value: cloud
            - name: RUN_MODE
              value: email-worker
            - name: INVOICE_EMAIL_ENABLED
              value: "true"
            - name: AUTO_MIGRATE
              value: "false"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${PROJECT_ID}"
            - name: CLOUD_TASKS_LOCATION
              value: "${REGION}"
            - name: CLOUD_TASKS_INVOICE_EMAIL_QUEUE
              value: invoice-emails
            - name: EMAIL_WORKER_URL
              value: "${EMAIL_WORKER_URL}"
            - name: CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL
              value: supay-email-tasks@${PROJECT_ID}.iam.gserviceaccount.com
            - name: STORAGE_DRIVER
              value: r2
            - name: DB_MAX_OPEN
              value: "10"
            - name: DB_MAX_IDLE
              value: "5"
            - name: SMTP_HOST
              value: "${SMTP_HOST}"
            - name: SMTP_PORT
              value: "587"
            - name: EMAIL_FROM
              value: "${EMAIL_FROM}"
            - name: EMAIL_FROM_NAME
              value: Supay
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: supay-smtp-username
                  key: latest
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supay-smtp-password
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supay-database-url
                  key: latest
            - name: R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: supay-r2-account-id
                  key: latest
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: supay-r2-access-key-id
                  key: latest
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: supay-r2-secret-access-key
                  key: latest
            - name: R2_BUCKET
              value: "${R2_BUCKET}"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
