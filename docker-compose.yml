# Supay — docker-compose único con profiles ["selfhosted","cloud"]
# selfhosted: BYO infra, XML/PDF en volumen local (STORAGE_DRIVER=local por defecto).
#   docker compose --profile selfhosted up
# cloud: infra administrada (R2 + DB gestionada), usar STORAGE_DRIVER=r2
#   DEPLOYMENT_MODE=cloud docker compose --profile cloud up

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["selfhosted", "cloud"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["selfhosted", "cloud"]
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-supay}?sslmode=disable
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhosted}
    ports:
      - "${PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - filedata:/app/data/files

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["storage-test"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["storage-test"]
    depends_on: [minio]
    entrypoint: ["/bin/sh"]
    command: ["-c", "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/supay-test"]

volumes:
  pgdata:
  filedata:
  miniodata:
